<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Rutina de gimnasio: seguimiento diario con modos completo/mínimo, historial y temporizador.">
<meta name="theme-color" content="#4f46e5">
<title>Rutina</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="stylesheet" href="./css/main.css">
</head>
<body>
<div class="wrap">
  <h1 id="headerIcon"> Rutina</h1>
  <div class="meta">Agregá, modificá y seguí tu progresión día a día</div>
  <div class="tabs" id="tabs"></div>
  <div id="days"></div>
  <div class="timer-box">
    <div class="timer-display" id="timerDisplay">00:40</div>
    <div class="presets" id="presets"></div>
    <div class="custom-row">
      <input type="number" id="customSec" placeholder="seg" min="1">
      <button class="preset-btn" id="customBtn">Usar</button>
    </div>
    <div class="controls">
      <button class="btn btn-start" id="startBtn">Iniciar</button>
      <button class="btn btn-reset" id="resetTimerBtn">Reset</button>
    </div>
  </div>
</div>

<button class="fab" id="fabBtn" aria-label="Menú de acciones"></button>
<div class="fab-menu" id="fabMenu">
  <button id="editMenuBtn"><span id="editLabel">Editar día</span></button>
  <button id="histMenuBtn"><span id="histLabel">Ver historial</span></button>
  <button class="danger-opt" id="resetMenuBtn">Reiniciar checks del día</button>
</div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
