<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Rutina de gimnasio: sesiones por fecha, historial semanal, racha y temporizador.">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymRutina">
<title>GymRutina</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="apple-touch-icon" href="./favicon.svg">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./css/main.css">
</head>
<body>
<main class="wrap">
  <h1 id="headerIcon"> GymRutina</h1>
  <div class="meta">Sesiones por fecha, historial semanal y racha</div>
  <nav class="primary-nav" id="primaryNav" aria-label="Vistas principales"></nav>
  <div class="tabs" id="tabs"></div>
  <div id="days"></div>
  <section class="timer-box" id="timerBox" aria-label="Temporizador de descanso">
    <div class="timer-display" id="timerDisplay">00:40</div>
    <div class="presets" id="presets"></div>
    <div class="custom-row">
      <label class="custom-label" for="customSec">Segundos</label>
      <input type="number" id="customSec" placeholder="45" min="1" max="3600" inputmode="numeric">
      <button class="preset-btn" id="customBtn">Aplicar</button>
    </div>
    <div class="controls">
      <button class="btn btn-start" id="startBtn">Iniciar</button>
      <button class="btn btn-reset" id="resetTimerBtn">Reset</button>
    </div>
  </section>
</main>

<button class="fab" id="fabBtn" aria-label="Menú de acciones" aria-controls="fabMenu" aria-expanded="false"></button>
<div class="fab-menu" id="fabMenu" role="group" aria-label="Acciones">
  <button id="editMenuBtn"><span id="editLabel">Editar rutina</span></button>
  <button id="exportMenuBtn">Exportar datos</button>
  <button id="importMenuBtn">Importar datos</button>
  <button class="danger-opt" id="resetMenuBtn">Reiniciar sesión…</button>
</div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script type="module" src="./js/app.js"></script>
</body>
</html>
